<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Friday AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              primary: '#059669', // Emerald 600 - Darker for contrast on glass
              accent: '#10B981', // Emerald 500
              secondary: '#3B82F6', // Blue 500
              surface: 'rgba(255, 255, 255, 0.7)',
              'surface-highlight': 'rgba(255, 255, 255, 0.9)',
            },
            animation: {
              'blob': 'blob 10s infinite',
              'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards', // Springy
              'slide-up-slow': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pop-in': 'popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'breathing': 'breathing 3s ease-in-out infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" }
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(40px) scale(0.95)" },
                "100%": { opacity: "1", transform: "translateY(0) scale(1)" }
              },
              popIn: {
                "0%": { opacity: "0", transform: "scale(0.8)" },
                "100%": { opacity: "1", transform: "scale(1)" }
              },
              breathing: {
                "0%, 100%": { transform: "scale(1)" },
                "50%": { transform: "scale(1.05)" }
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" }
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
              'glass-sm': '0 4px 16px 0 rgba(31, 38, 135, 0.05)',
              'glow': '0 0 20px rgba(16, 185, 129, 0.4)',
              'glow-xl': '0 0 40px rgba(16, 185, 129, 0.3)',
            },
            backdropBlur: {
              'xs': '2px',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F8FAFC;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden; /* Prevent body scroll, handle in app */
      }
      
      /* Mesh Gradient Background */
      .bg-mesh-gradient {
        background-color: #f3f4f6;
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-image: 
          radial-gradient(at 40% 20%, hsla(148, 50%, 90%, 1) 0px, transparent 50%),
          radial-gradient(at 80% 0%, hsla(189, 100%, 90%, 1) 0px, transparent 50%),
          radial-gradient(at 0% 50%, hsla(341, 100%, 96%, 1) 0px, transparent 50%),
          radial-gradient(at 80% 50%, hsla(260, 100%, 96%, 1) 0px, transparent 50%),
          radial-gradient(at 0% 100%, hsla(220, 100%, 96%, 1) 0px, transparent 50%),
          radial-gradient(at 80% 100%, hsla(240, 100%, 96%, 1) 0px, transparent 50%),
          radial-gradient(at 0% 0%, hsla(340, 100%, 96%, 1) 0px, transparent 50%);
      }

      /* Clean Scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Glassmorphism Utilities */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
      }
      
      .glass-input {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(4px);
      }

      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          transition: background-color 5000s ease-in-out 0s;
          -webkit-text-fill-color: #0f172a !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-mesh-gradient min-h-screen text-slate-800 antialiased selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
